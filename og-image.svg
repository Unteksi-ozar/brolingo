<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58CC02"/>
      <stop offset="100%" stop-color="#3dab00"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z" fill="white" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Inner card border -->
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Owl -->
  <text x="600" y="300" text-anchor="middle" dominant-baseline="middle"
        font-size="180" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🦉</text>

  <!-- Wordmark -->
  <text x="600" y="415" text-anchor="middle"
        font-size="92" font-weight="900" fill="white"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-2">Brolingo</text>

  <!-- Tagline -->
  <text x="600" y="472" text-anchor="middle"
        font-size="27" fill="rgba(255,255,255,0.88)"
        font-family="Arial, Helvetica, sans-serif" font-weight="600">
    Learn the Language of Corporate Nonsense
  </text>

  <!-- Bottom bar -->
  <rect y="558" width="1200" height="72" fill="rgba(0,0,0,0.22)"/>
  <text x="600" y="601" text-anchor="middle"
        font-size="20" fill="rgba(255,255,255,0.75)"
        font-family="Arial, Helvetica, sans-serif" font-weight="600" letter-spacing="0.3">
    A project by Fresh Cake  ·  freshcake.wtf  ·  github.com/freshcakewtf/brolingo
  </text>
</svg>
